services:
  - type: web
    name: eventhub-frontend-demo
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://eventhub-api-demo.onrender.com/api
      - key: VITE_BACKOFFICE_URL
        value: https://eventhub-api-demo.onrender.com/admin/login
